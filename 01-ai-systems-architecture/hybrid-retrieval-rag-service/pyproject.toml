[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-retrieval-rag-service"
version = "1.0.0"
description = "Retrieval-augmented QA service with hybrid dense/BM25 retrieval, reranking and grounded citations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    # LLM
    "anthropic>=0.40.0",
    # Vector store
    "pinecone>=5.0.0",
    # Sparse retrieval leg
    "rank-bm25>=0.2.2",
    # Tokenizer for chunk sizing only (no PyTorch pulled in)
    "transformers>=4.40.0",
    # Document loading
    "pypdf>=4.3.0",
    # Web layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    # UI
    "streamlit>=1.38.0",
    # Config and validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # Cohere embed + rerank are called over plain HTTP; the SDK would pull in
    # tokenizers and huggingface_hub for two endpoints.
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    # Structured logging
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools]
packages = ["src", "config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
