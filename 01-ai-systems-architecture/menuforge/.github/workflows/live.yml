name: live

# Real, paid Anthropic API calls. Never on push. Manual by default, so spend
# happens when someone chooses it. See DECISIONS.md D-005.
#
#   gh workflow run live.yml
#
# To also run it automatically, uncomment the two `schedule` lines below. That
# is one paid request per firing, on a clock nobody is watching, so turn it on
# deliberately — and watch for failures, since an unread red run is the failure
# mode a schedule invites.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"   # Mondays, 06:00 UTC

# A queued run and a running one would each spend. Keep at most one.
concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Absent on forks. The suite skips rather than fails when it is missing,
      # so a fork's run reports skipped instead of red.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The live test writes to its own throwaway SQLite file, so no Postgres
      # service is needed here.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Report whether a key is present
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set — live tests will skip."
          else
            echo "ANTHROPIC_API_KEY is set; live tests will make one real request."
          fi

      - name: Live tests
        run: pytest -m live -v
