name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      # The local suite falls back to SQLite for speed; CI runs against the real
      # datastore, because that is the run that has to be trusted. See
      # tests/conftest.py and DECISIONS.md D-002.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: menuforge
          POSTGRES_PASSWORD: menuforge
          POSTGRES_DB: menuforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://menuforge:menuforge@localhost:5432/menuforge
      # This run makes no real API call — the client is patched, and the `live`
      # marker is deselected by default (see pyproject and the live workflow).
      # The value exists only so the client can be constructed. Not a credential.
      ANTHROPIC_API_KEY: test-key-not-a-real-credential

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Type check
        run: mypy src tests scripts

      # Includes the socket-level tests in tests/test_server.py, which run a
      # real uvicorn server on an ephemeral port. `live` is deselected here.
      - name: Test
        run: pytest -v

      # The build record quotes counts from this repo. Fail rather than let a
      # document whose whole purpose is accuracy carry a wrong number.
      - name: Build record counts are current
        run: python scripts/derive_artifact.py --check

      # A misplaced marker would silently stop the paid tests from ever running.
      - name: Live tests are collectable
        run: pytest -m live --collect-only -q
