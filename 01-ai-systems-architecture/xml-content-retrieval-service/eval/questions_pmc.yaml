# Labelled evaluation set for the chunking comparison — JATS / PubMed Central corpus.
#
# Same contract as questions.yaml:
#
#   source_file / section_id  — where the answer was authored
#   answer_span               — a short, atomic fact lifted VERBATIM from that
#                               section. A chunk is judged relevant if it
#                               contains this span.
#
# How this set was built, and what that means for the numbers
# -----------------------------------------------------------
# Questions were hand-authored against the real articles, not generated from the
# chunks. Three rules were applied, because breaking any of them would flatter
# both strategies rather than separate them:
#
#   1. **Paraphrase, never echo.** The question uses different words from the
#      section wherever the subject matter allows. A question that repeats the
#      chunk's distinctive terms is answered by term overlap alone and measures
#      nothing about boundaries.
#   2. **Short, atomic spans.** A long span is unfair to the naive strategy for
#      reasons unrelated to chunk boundaries — it is simply more likely to
#      straddle a window edge by chance. A short one tests exactly the thing in
#      question.
#   3. **Spans verified unique.** Every span below was checked to occur in
#      exactly one structure-aware chunk across the whole corpus. A span
#      appearing in two sections would make "the right chunk" ambiguous and
#      quietly inflate recall.
#
# ⚠️ Honest limitation: the corpus is fetched live from PMC by
# scripts/fetch_pmc.py and PMC re-issues articles, so a span can in principle
# drift. eval/verify_questions.py re-checks all three rules against the corpus
# on disk and fails loudly rather than scoring a stale question set.

questions:
  # ---- PMC42766235 — delayed malaria treatment-seeking, Tigray ----
  - id: p01
    question: What was the mean age in months of the children in the case group?
    source_file: PMC42766235
    section_id: Sec36
    answer_span: "29.95 (SD ± 13.34) months"

  - id: p02
    question: What percentage of caregivers of cases lived in a rural area?
    source_file: PMC42766235
    section_id: Sec36
    answer_span: "Rural residence was reported by 75.3%"

  - id: p03
    question: How did the authors try to limit recall bias in this study?
    source_file: PMC42766235
    section_id: Sec41
    answer_span: "restricting the recall period to six months"

