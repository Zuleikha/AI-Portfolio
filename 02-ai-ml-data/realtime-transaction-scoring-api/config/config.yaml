data:
  raw_path: data/raw/creditcard.csv
  test_size: 0.2
  random_state: 42

features:
  numeric:
    - V1
    - V2
    - V3
    - V4
    - V5
    - V6
    - V7
    - V8
    - V9
    - V10
    - V11
    - V12
    - V13
    - V14
    - V15
    - V16
    - V17
    - V18
    - V19
    - V20
    - V21
    - V22
    - V23
    - V24
    - V25
    - V26
    - V27
    - V28
    - log_amount
    - hour_of_day
  categorical: []

model:
  # The serving bundle is the single source of truth: model, threshold and
  # feature order travel together so they cannot drift apart.
  bundle_dir: outputs/models/bundle_v1
  path: outputs/models/bundle_v1/model.pkl                # production model — loaded by the API
  candidate_path: outputs/models/retrain_candidate.pkl    # written by src/train.py; promote manually
  bundle_metadata: outputs/models/bundle_v1/metadata.json # hyperparameter source for retraining

prediction:
  # Serving reads the threshold from the bundle, not from here. This value is
  # the training-time default and is kept so src/ has one place to look.
  threshold: 0.28
