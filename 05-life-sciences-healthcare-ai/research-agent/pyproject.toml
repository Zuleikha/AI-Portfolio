[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real NCBI API, free (opt-in: pytest -m live)",
    "live_paid: calls the real Anthropic API, COSTS MONEY (opt-in: pytest -m live_paid, user OK each run)",
]
addopts = "-m 'not live and not live_paid'"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["research_agent", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["research_agent", "scripts", "tests"]
