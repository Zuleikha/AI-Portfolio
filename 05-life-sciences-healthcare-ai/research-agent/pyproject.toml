[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real NCBI API (opt-in: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["research_agent"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
packages = ["research_agent", "tests"]
