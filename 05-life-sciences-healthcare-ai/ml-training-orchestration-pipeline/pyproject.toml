[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-training-orchestration-pipeline"
version = "1.0.0"
description = "Asset-orchestrated transformer fine-tuning pipeline with experiment tracking, drift detection and a serving API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    # Training
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.15.0",
    "accelerate>=0.25.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.19.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # Orchestration
    "dagster>=1.5.0",
    "dagster-webserver>=1.5.0",
    # Experiment tracking
    "mlflow>=2.8.0",
    # Serving
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    # Monitoring
    "prometheus-client>=0.19.0",
    # src/monitoring/drift_detector.py uses `from scipy import stats` for the
    # KS-test. It resolved only as a transitive dependency of scikit-learn,
    # which is not something to rely on — declared explicitly.
    "scipy>=1.11.0",
    # Evaluation plots (src/evaluation/evaluator.py)
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
