services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
      - ./mlruns:/app/mlruns
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dagster:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PYTHONUNBUFFERED=1
      - DAGSTER_HOME=/app/dagster_home
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
      - ./mlruns:/app/mlruns
    command: dagster dev -h 0.0.0.0 -p 3000 -f src/dagster_definitions.py

  mlflow:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:/app/mlruns
